name: Arduino board compilation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: arduino:avr@1.8.6
            fqbn: arduino:avr:uno
          - core: arduino:avr@1.8.6
            fqbn: arduino:avr:nano
          - core: arduino:avr@1.8.6
            fqbn: arduino:avr:mega
          - core: esp8266:esp8266@3.1.2
            fqbn: esp8266:esp8266:nodemcuv2
          - core: esp32:esp32@2.0.17
            fqbn: esp32:esp32:esp32
          - core: esp32:esp32@2.0.17
            fqbn: esp32:esp32:esp32s3
          - core: esp32:esp32@3.0.7
            fqbn: esp32:esp32:esp32
          - core: esp32:esp32@3.0.7
            fqbn: esp32:esp32:esp32s3
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Configure boards manager
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install '${{ matrix.core }}'
      # Core versions are pinned so release builds do not change over time. Update deliberately.
      - name: Compile examples
        run: |
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --library . examples/BasicBalance
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --library . examples/MotorCommandDemo
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --library . examples/FilterTelemetryDemo
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --library . examples/GyroBiasCalibrationDemo
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --library . examples/DeadZoneDemo
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --library . examples/SafetyGuardDemo
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --library . examples/PwmCalibrationDemo
      # These demos use the ESP32 STEP/DIR backend. A4988/DRV8825 motor
      # routines are active on classic ESP32; ESP32-S3 builds use inert stubs.
      # Compiling here checks API/conditional compilation, NOT real motor output.
      - name: Compile ESP32 STEP/DIR demos
        if: startsWith(matrix.fqbn, 'esp32:esp32:')
        run: |
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --library . examples/ESP32_StepDirFirstTest
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --library . examples/ESP32_A4988_Demo
          arduino-cli compile --fqbn '${{ matrix.fqbn }}' --library . examples/ESP32_DRV8825_Demo

  gemma:
    # Gemma / ATtiny85 has no Serial: only the inert PWM demo must compile there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile inert demo for Gemma
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
          arduino-cli core install adafruit:avr
          arduino-cli compile --fqbn adafruit:avr:gemma --library . examples/PwmCalibrationDemo
